[project]
name = "hearmate-backend"
version = "0.1.0"
description = "HearMate API: auditory-training platform for children with APD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "cmudict>=1.1.3",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, obvious dummy credentials ("pw", "x") and seeded (non-crypto) randomness.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Ship without type information.
module = ["faster_whisper.*", "cmudict.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs PostgreSQL (docker compose up -d db); skip with -m 'not db'"]
