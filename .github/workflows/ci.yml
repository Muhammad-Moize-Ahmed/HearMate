name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    # Normally ~2 min. A cap stops a stuck run from holding a runner for GitHub's 6-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hearmate
          POSTGRES_USER: hearmate
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hearmate -d hearmate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway CI container only; tests create and use a separate "hearmate_test" database.
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hearmate
      POSTGRES_USER: hearmate
      POSTGRES_PASSWORD: ci-throwaway
      # The audio tests fail (instead of skipping) if the ffmpeg install step didn't work.
      HEARMATE_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v5
      # An exact version: setup-uv stopped publishing floating major tags (v8+). v7+ runs on Node 24.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      # 26 tests (test_speech_audio.py, db/test_speech_rounds.py) decode audio with real ffmpeg and
      # are silently skipped without it. Slow apt mirrors have stalled this step before, so: skip if
      # the image already has ffmpeg; try the runner's existing package lists first (no full
      # `apt-get update`); drop a stalled connection after 30 s and retry; at most 3 attempts.
      - name: Install ffmpeg (audio decoding for speech tests)
        timeout-minutes: 6
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -n 1; exit 0; fi
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          install_ffmpeg() { sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg; }
          for attempt in 1 2 3; do
            # Stale lists can point at removed package versions; refresh them only then.
            if install_ffmpeg || { sudo apt-get "${apt_opts[@]}" update && install_ffmpeg; }; then
              ffmpeg -version | head -n 1
              exit 0
            fi
            echo "ffmpeg install attempt $attempt failed; retrying in $((attempt * 10)) s"
            sleep $((attempt * 10))
          done
          exit 1
      - run: uv sync --locked
        timeout-minutes: 5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
        timeout-minutes: 8

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    # Normally under 1 min.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # v6.1.0 exactly: the first release that supports pnpm 12 (the floating v6 tag lags behind).
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
        timeout-minutes: 5
      - run: pnpm build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    # Normally ~10 s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
